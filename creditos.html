<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créditos - Nuestra Historia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor de corazones flotantes de fondo */
        #corazones-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .corazon-flotante {
            position: absolute;
            color: #1e90ff;
            font-size: 24px;
            animation: flotarUp 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes flotarUp {
            0% {
                transform: translateY(105vh) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor principal estilo cine */
        #cine-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .escena {
            position: absolute;
            width: 85%;
            max-width: 600px;
            text-align: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            pointer-events: none;
        }

        .escena.activa {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .escena img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #1e90ff;
            box-shadow: 0 10px 30px rgba(30, 144, 255, 0.4);
            margin-bottom: 25px;
            background-color: #1a1a1a;
        }

        h1 {
            color: #1e90ff;
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 0 2px 15px rgba(30, 144, 255, 0.5);
            letter-spacing: 1px;
        }

        p {
            font-size: 22px;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 35px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #00bfff;
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0, 191, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- Fondo de corazones flotantes -->
    <div id="corazones-fondo"></div>

    <div id="cine-container">
        
        <!-- Escena 1 -->
        <div class="escena activa">
            <img src="imagencreditos1.jpg" alt="Créditos 1" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'240\' height=\'240\'><rect width=\'100%\' height=\'100%\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'60\' fill=\'%231e90ff\'>💙</text></svg>';">
            <h1>Eres el amor de mi vida</h1>
        </div>

        <!-- Escena 2 -->
        <div class="escena">
            <img src="imagencreditos2.jpg" alt="Créditos 2" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'240\' height=\'240\'><rect width=\'100%\' height=\'100%\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'60\' fill=\'%231e90ff\'>💙</text></svg>';">
            <h1>Mi esposo</h1>
        </div>

        <!-- Escena 3 -->
        <div class="escena">
            <img src="imagencreditos3.jpg" alt="Créditos 3" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'240\' height=\'240\'><rect width=\'100%\' height=\'100%\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'60\' fill=\'%231e90ff\'>💙</text></svg>';">
            <h1>Mi alma gemela</h1>
        </div>

        <!-- Escena 4 (Final) -->
        <div class="escena">
            <img src="fin.jpg" alt="Fin" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'240\' height=\'240\'><rect width=\'100%\' height=\'100%\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'60\' fill=\'%231e90ff\'>💙</text></svg>';">
            <h1>Te amo con todo mi corazón Husbunny</h1>
            <a href="juego.html" class="btn">Jugar de nuevo 🎮</a>
        </div>

    </div>

    <script>
        // Generador automático de corazones azules flotantes
        function crearCorazonFondo() {
            const contenedor = document.getElementById("corazones-fondo");
            const corazon = document.createElement("div");
            corazon.classList.add("corazon-flotante");
            corazon.innerHTML = Math.random() > 0.5 ? "💙" : "✨";
            
            corazon.style.left = Math.random() * 100 + "vw";
            corazon.style.animationDuration = (Math.random() * 3 + 4) + "s";
            corazon.style.fontSize = (Math.random() * 15 + 18) + "px";

            contenedor.appendChild(corazon);

            setTimeout(() => {
                corazon.remove();
            }, 7000);
        }

        setInterval(crearCorazonFondo, 400);

        // Sucesión automática de créditos estilo película
        let escenaActual = 0;
        const escenas = document.querySelectorAll(".escena");
        const tiempoPorEscena = 4500; // 4.5 segundos por cada escena

        function cambiarEscenaCinematografica() {
            escenas[escenaActual].classList.remove("activa");
            escenaActual++;

            if (escenaActual < escenas.length) {
                escenas[escenaActual].classList.add("activa");
            } else {
                escenaActual = escenas.length - 1;
                escenas[escenaActual].classList.add("activa");
                clearInterval(intervaloPelicula);
            }
        }

        let intervaloPelicula = setInterval(cambiarEscenaCinematografica, tiempoPorEscena);
    </script>

</body>
</html>
