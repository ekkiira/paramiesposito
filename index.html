<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I bunny you! - Inicio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('pantalladeinicio.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Todo se alinea abajo para dejar libres a los conejitos */
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            text-align: center;
            box-sizing: border-box;
            padding: 25px 20px;
            overflow: hidden;
            position: relative;
        }

        /* Fondo de corazones flotantes azules y rosas */
        #corazones-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .corazon-flotante {
            position: absolute;
            font-size: 22px;
            animation: flotarUp 6s linear infinite;
            opacity: 0.75;
        }

        @keyframes flotarUp {
            0% {
                transform: translateY(105vh) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Bloque inferior que contiene título, botones y música ordenados */
        .bloque-inferior {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.35); /* Fondo sutil para que resalte sobre el bosque */
            padding: 20px 30px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Título grande sin emoji */
        h1 {
            font-size: 40px;
            margin: 0;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 3px 15px rgba(255, 105, 180, 0.7), 0 0 30px rgba(30, 144, 255, 0.5);
            animation: latidoTitulo 2s ease-in-out infinite;
        }

        @keyframes latidoTitulo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* Contenedor de botones */
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: rgba(255, 182, 193, 0.3);
            color: #fff;
            padding: 10px 22px;
            font-size: 15px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .btn:hover {
            background-color: rgba(255, 105, 180, 0.7);
            border-color: #ff69b4;
            transform: scale(1.06);
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.5);
        }

        .btn-creditos {
            background-color: rgba(221, 160, 221, 0.3);
        }

        .btn-creditos:hover {
            background-color: rgba(186, 85, 211, 0.7);
            border-color: #dda0dd;
        }

        /* Control de música integrado y discreto */
        .musica-control {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 6px 16px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .musica-control:hover {
            background: rgba(255, 105, 180, 0.5);
        }
    </style>
</head>
<body>

    <!-- Fondo de corazones flotantes azules y rosas -->
    <div id="corazones-fondo"></div>

    <!-- Elemento de audio -->
    <audio id="audioFondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Bloque inferior organizado para dejar los conejitos libres -->
    <div class="bloque-inferior">
        <h1>I bunny you!</h1>

        <div class="btn-container">
            <a href="juego.html" class="btn">Comenzar Aventura 🤍</a>
            <a href="creditos.html" class="btn btn-creditos">Créditos ✨</a>
        </div>

        <button class="musica-control" onclick="toggleMusica()" id="btnMusica">🎵 Reproducir Música 🤍</button>
    </div>

    <script>
        // Generador automático de corazones azules y rosas
        function crearCorazonFondo() {
            const contenedor = document.getElementById("corazones-fondo");
            const corazon = document.createElement("div");
            corazon.classList.add("corazon-flotante");
            
            const simbolos = ["💖", "💙", "✨", "💕", "🩵"];
            corazon.innerHTML = simbolos[Math.floor(Math.random() * simbolos.length)];
            
            corazon.style.left = Math.random() * 100 + "vw";
            corazon.style.animationDuration = (Math.random() * 3 + 4) + "s";
            corazon.style.fontSize = (Math.random() * 14 + 16) + "px";

            contenedor.appendChild(corazon);

            setTimeout(() => {
                corazon.remove();
            }, 7000);
        }

        setInterval(crearCorazonFondo, 450);

        // Control de reproducción de música
        const audio = document.getElementById("audioFondo");
        const btnMusica = document.getElementById("btnMusica");
        let reproduciendo = false;

        function toggleMusica() {
            if (reproduciendo) {
                audio.pause();
                btnMusica.innerHTML = "🎵 Reproducir Música 🤍";
                reproduciendo = false;
            } else {
                audio.play().then(() => {
                    btnMusica.innerHTML = "🔇 Pausar Música 🎶";
                    reproduciendo = true;
                }).catch(e => {
                    alert("Sube un archivo de música llamado 'musica.mp3' a tu repositorio para que suene.");
                });
            }
        }

        // Intento de reproducción automática al primer clic del usuario
        window.addEventListener('click', () => {
            if (!reproduciendo) {
                audio.play().then(() => {
                    btnMusica.innerHTML = "🔇 Pausar Música 🎶";
                    reproduciendo = true;
                }).catch(() => {});
            }
        }, { once: true });
    </script>

</body>
</html>
