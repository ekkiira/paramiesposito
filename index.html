<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I bunny you! - Inicio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('pantalladeinicio.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            text-align: center;
            box-sizing: border-box;
            padding: 40px 20px;
        }
        h1 {
            font-size: 40px;
            margin: 0;
            font-weight: bold;
            color: #fff9f9;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.9);
        }
        .btn-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #ffb6c1;
            color: #fff;
            padding: 14px 28px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <h1>I bunny you! 🐰</h1>
    
    <div class="btn-container">
        <a href="juego.html" class="btn">Comenzar Aventura 🤍</a>
        <a href="creditos.html" class="btn" style="background-color: #dda0dd;">Créditos ✨</a>
    </div>
</body>
</html>
