<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi espositivo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('pantalladeinicio.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #ffb6c1;
            color: #fff;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.05);
        }
        img.icon {
            width: 80px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="conejitocorriendo.png" alt="Conejo tierno" class="icon">
        <h1>¡Hola mi amor! ¿Estás listo para este pequeño reto?</h1>
        <a href="juego.html" class="btn">Comenzar Aventura 🐰❤️</a>
    </div>

</body>
</html>
