<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura del Conejito - Juego</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #hud {
            position: absolute;
            top: 25px;
            left: 35px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            z-index: 5;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }
        .overlay img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            border: 3px solid #ffb6c1;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 20px;
            border-radius: 35px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">Nivel: <span id="txt-nivel">1</span>/5 | Puntos: <span id="txt-puntos">0</span>/100</div>
        
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- Pantalla de Derrota -->
        <div id="pantalla-derrota" class="overlay hidden">
            <img src="pantalladeperdiste.jpg" alt="Perdiste">
            <h2>¡Casi, mi amor! El conejito tropezó 🥺</h2>
            <p style="font-size: 20px;">¡Vuelve a intentarlo!</p>
            <button class="btn" onclick="reiniciarNivel()">Reintentar Nivel</button>
        </div>

        <!-- Pantalla de Victoria de Nivel con respaldo de imagen -->
        <div id="pantalla-victoria" class="overlay hidden">
            <img src="ganadordenivel.png" onerror="this.onerror=null; this.src='ganadordenivel.jpg';" alt="Ganador">
            <h2 id="titulo-victoria">¡Nivel Superado! 🎉</h2>
            <p id="texto-victoria" style="font-size: 20px;">¡Excelente trabajo, mi vida!</p>
            <button class="btn" onclick="siguienteNivel()">Siguiente Nivel ➡</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const imgConejo = new Image(); imgConejo.src = "conejitocorriendo.png";
        const fondoDia = new Image(); fondoDia.src = "fondodia.jpg";
        const fondoNoche = new Image(); fondoNoche.src = "fondonoche.jpg";

        let nivel = 1;
        let puntos = 0;
        let juegoActivo = false;
        let tiempoCiclo = 0;

        let conejo = {
            x: 100, 
            y: 280, 
            width: 100,   
            height: 100,  
            vy: 0, 
            gravedad: 0.6,        // Ligeramente más ágil para respuesta rápida
            fuerzaSalto: -12,     // Salto dinámico y cómodo
            suelo: 280,  
            enSuelo: false
        };

        let zanahorias = []; 
        let obstaculos = []; 
        let contadorFrames = 0;

        window.addEventListener("keydown", e => { 
            if (e.code === "Space") { 
                e.preventDefault(); 
                saltar(); 
            } 
        });
        canvas.addEventListener("click", () => saltar());

        function saltar() {
            if (!juegoActivo) return;
            if (conejo.enSuelo) {
                conejo.vy = conejo.fuerzaSalto;
                conejo.enSuelo = false;
            }
        }

        function iniciarJuego() {
            nivel = 1;
            cargarNivel();
        }

        function cargarNivel() {
            puntos = 0;
            tiempoCiclo = 0;
            actualizarHUD();
            conejo.y = conejo.suelo;
            conejo.vy = 0;
            conejo.enSuelo = true;
            zanahorias = [];
            obstaculos = [];
            contadorFrames = 0;

            juegoActivo = true;
            document.getElementById("pantalla-derrota").classList.add("hidden");
            document.getElementById("pantalla-victoria").classList.add("hidden");
            loop();
        }

        function reiniciarNivel() {
            cargarNivel();
        }

        function siguienteNivel() {
            nivel++;
            if (nivel > 5) {
                window.location.href = "creditos.html"; 
            } else {
                cargarNivel();
            }
        }

        function actualizarHUD() {
            document.getElementById("txt-nivel").innerText = nivel;
            document.getElementById("txt-puntos").innerText = puntos;
        }

        function actualizar() {
            if (!juegoActivo) return;

            tiempoCiclo += 1/60; 

            conejo.vy += conejo.gravedad;
            conejo.y += conejo.vy;

            if (conejo.y >= conejo.suelo) {
                conejo.y = conejo.suelo;
                conejo.vy = 0;
                conejo.enSuelo = true;
            } else {
                conejo.enSuelo = false;
            }

            // Velocidad del mundo ligeramente incrementada para que vaya más fluido y rápido
            let velocidadMundo = 3.8 + (nivel * 0.4);
            contadorFrames++;

            if (contadorFrames % 110 === 0) {
                let alturaZanahoria = Math.random() > 0.4 ? 310 : 200; 
                zanahorias.push({ x: canvas.width + 50, y: alturaZanahoria, radius: 18, valor: 20 });
            }

            if (contadorFrames % 170 === 0) {
                obstaculos.push({ x: canvas.width + 50, y: 315, width: 35, height: 55 });
            }

            for (let i = zanahorias.length - 1; i >= 0; i--) {
                zanahorias[i].x -= velocidadMundo;
                
                let dx = (conejo.x + conejo.width/2) - zanahorias[i].x;
                let dy = (conejo.y + conejo.height/2) - zanahorias[i].y;
                if (Math.hypot(dx, dy) < 55) {
                    puntos += zanahorias[i].valor;
                    zanahorias.splice(i, 1);
                    actualizarHUD();

                    if (puntos >= 100) {
                        juegoActivo = false;
                        if (nivel === 5) {
                            document.getElementById("titulo-victoria").innerText = "¡Completaste todos los niveles! ❤️";
                            document.getElementById("texto-victoria").innerText = "¡Eres el mejor, mi amor! ¡Vamos a los créditos!";
                        } else {
                            document.getElementById("titulo-victoria").innerText = `¡Nivel ${nivel} Superado! 🎉`;
                            document.getElementById("texto-victoria").innerText = "¡Lo lograste, mi vida!";
                        }
                        document.getElementById("pantalla-victoria").classList.remove("hidden");
                        return;
                    }
                } else if (zanahorias[i].x < -50) {
                    zanahorias.splice(i, 1);
                }
            }

            for (let i = obstaculos.length - 1; i >= 0; i--) {
                obstaculos[i].x -= velocidadMundo;

                if (
                    conejo.x + 22 < obstaculos[i].x + obstaculos[i].width &&
                    conejo.x + conejo.width - 22 > obstaculos[i].x &&
                    conejo.y + conejo.height > obstaculos[i].y + 15
                ) {
                    juegoActivo = false;
                    document.getElementById("pantalla-derrota").classList.remove("hidden");
                    return;
                }

                if (obstaculos[i].x < -50) {
                    obstaculos.splice(i, 1);
                }
            }
        }

        function dibujar() {
            let cicloActual = Math.floor(tiempoCiclo / 20) % 2; 
            let fondoActivo = (cicloActual === 0) ? fondoDia : fondoNoche;

            if (fondoActivo.complete) {
                ctx.drawImage(fondoActivo, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = (cicloActual === 0) ? "#87CEEB" : "#0d1b2a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            for (let z of zanahorias) {
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ff7f00";
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = "#fff";
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = "#228b22";
                ctx.fillRect(z.x - 4, z.y - z.radius - 10, 8, 10);
            }

            for (let o of obstaculos) {
                ctx.fillStyle = "#8b4513";
                ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.fillStyle = "#5c2c16";
                ctx.fillRect(o.x + 4, o.y + 4, o.width - 8, 10);
            }

            if (imgConejo.complete) {
                ctx.drawImage(imgConejo, conejo.x, conejo.y, conejo.width, conejo.height);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(conejo.x, conejo.y, conejo.width, conejo.height);
            }
        }

        function loop() {
            if (!juegoActivo) return;
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        window.onload = () => iniciarJuego();
    </script>
</body>
</html>
