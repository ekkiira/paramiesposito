<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura del Conejito - Juego</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            z-index: 5;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }
        .overlay img {
            width: 170px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">Nivel: <span id="txt-nivel">1</span>/5 | Puntos: <span id="txt-puntos">0</span>/100</div>
        
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- Pantalla de Derrota -->
        <div id="pantalla-derrota" class="overlay hidden">
            <img src="pantalladeperdiste.jpg" alt="Perdiste">
            <h2>¡Oh no, el conejito tropezó! 🥺</h2>
            <p>¡Inténtalo de nuevo, mi amor!</p>
            <button class="btn" onclick="reiniciarNivel()">Reintentar Nivel</button>
        </div>

        <!-- Pantalla de Victoria de Nivel -->
        <div id="pantalla-victoria" class="overlay hidden">
            <img src="Ganadorodenivel.png" alt="Ganador">
            <h2 id="titulo-victoria">¡Nivel Superado! 🎉</h2>
            <p id="texto-victoria">¡Excelente trabajo mi amor!</p>
            <button class="btn" onclick="siguienteNivel()">Siguiente Nivel ➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        // Imágenes
        const imgConejo = new Image(); imgConejo.src = "conejitocorriendo.png";
        const fondoDia = new Image(); fondoDia.src = "fondodia.jpg";
        const fondoNoche = new Image(); fondoNoche.src = "fondonoche.jpg";

        // Estado del juego
        let nivel = 1;
        let puntos = 0;
        let juegoActivo = false;
        let tiempoCiclo = 0; // Para cambiar día/noche cada 20s

        let conejo = {
            x: 80, y: 300, width: 50, height: 50,
            vy: 0, gravedad: 0.65, fuerzaSalto: -12, suelo: 320, enSuelo: false
        };

        let rampas = []; // plataformas y rampas
        let zanahorias = []; // bolitas naranjas (+20pts)
        let obstaculos = []; // pinchos o troncos
        let contadorFrames = 0;

        window.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); saltar(); } });
        canvas.addEventListener("click", () => saltar());

        function saltar() {
            if (!juegoActivo) return;
            if (conejo.enSuelo) {
                conejo.vy = conejo.fuerzaSalto;
                conejo.enSuelo = false;
            }
        }

        function iniciarJuego() {
            nivel = 1;
            cargarNivel();
        }

        function cargarNivel() {
            puntos = 0;
            tiempoCiclo = 0;
            actualizarHUD();
            conejo.y = 300;
            conejo.vy = 0;
            rampas = [];
            zanahorias = [];
            obstaculos = [];
            contadorFrames = 0;

            // Crear terreno base con rampas según dificultad del nivel
            let anchoX = 0;
            while(anchoX < 3000) {
                let tipo = Math.floor(Math.random() * 3); // 0: plano, 1: subida, 2: bajada
                let rAncho = 200 + Math.random() * 100;
                rampas.push({ x: anchoX, y: 320, width: rAncho, tipo: 0 });
                anchoX += rAncho;
            }

            juegoActivo = true;
            document.getElementById("pantalla-derrota").classList.add("hidden");
            document.getElementById("pantalla-victoria").classList.add("hidden");
            loop();
        }

        function reiniciarNivel() {
            cargarNivel();
        }

        function siguienteNivel() {
            nivel++;
            if (nivel > 5) {
                window.location.href = "creditos.html"; // Al pasar los 5 niveles, pasa a créditos
            } else {
                cargarNivel();
            }
        }

        function actualizarHUD() {
            document.getElementById("txt-nivel").innerText = nivel;
            document.getElementById("txt-puntos").innerText = puntos;
        }

        function actualizar() {
            if (!juegoActivo) return;

            tiempoCiclo += 1/60; // 60 fps aprox -> cuenta segundos

            // Gravedad y movimiento del conejo
            conejo.vy += conejo.gravedad;
            conejo.y += conejo.vy;

            // Velocidad del mundo según el nivel (sube dificultad)
            let velocidadMundo = 3.5 + (nivel * 0.8);

            // Generar elementos dinámicos
            contadorFrames++;
            if (contadorFrames % Math.max(50, 110 - (nivel * 10)) === 0) {
                // Generar zanahoria (bolita naranja)
                zanahorias.push({ x: canvas.width + Math.random()*100, y: 180 + Math.random()*100, radius: 12, valor: 20 });
            }
            if (contadorFrames % Math.max(70, 140 - (nivel * 12)) === 0) {
                // Generar obstáculo
                obstaculos.push({ x: canvas.width + Math.random()*50, y: 300, width: 30, height: 40 });
            }

            // Mover y verificar zanahorias
            for (let i = zanahorias.length - 1; i >= 0; i--) {
                zanahorias[i].x -= velocidadMundo;
                // Colisión con conejito
                let dx = (conejo.x + conejo.width/2) - zanahorias[i].x;
                let dy = (conejo.y + conejo.height/2) - zanahorias[i].y;
                if (Math.hypot(dx, dy) < 35) {
                    puntos += zanahorias[i].valor;
                    zanahorias.splice(i, 1);
                    actualizarHUD();

                    if (puntos >= 100) {
                        juegoActivo = false;
                        if (nivel === 5) {
                            document.getElementById("titulo-victoria").innerText = "¡Completaste todos los niveles! ❤️";
                            document.getElementById("texto-victoria").innerText = "¡Eres la mejor jugadora, vamos a los créditos!";
                        } else {
                            document.getElementById("titulo-victoria").innerText = `¡Nivel ${nivel} Superado! 🎉`;
                            document.getElementById("texto-victoria").innerText = "¡Lo lograste, pasas al siguiente nivel!";
                        }
                        document.getElementById("pantalla-victoria").classList.remove("hidden");
                        return;
                    }
                } else if (zanahorias[i] && zanahorias[i].x < -50) {
                    zanahorias.splice(i, 1);
                }
            }

            // Mover y verificar obstáculos
            for (let i = obstaculos.length - 1; i >= 0; i--) {
                obstaculos[i].x -= velocidadMundo;
                if (
                    conejo.x < obstaculos[i].x + obstaculos[i].width &&
                    conejo.x + conejo.width > obstaculos[i].x &&
                    conejo.y + conejo.height > obstaculos[i].y
                ) {
                    juegoActivo = false;
                    document.getElementById("pantalla-derrota").classList.remove("hidden");
                    return;
                }
                if (obstaculos[i].x < -50) obstaculos.splice(i, 1);
            }

            // Suelo básico y colisión vertical
            if (conejo.y >= conejo.suelo) {
                conejo.y = conejo.suelo;
                conejo.vy = 0;
                conejo.enSuelo = true;
            } else {
                conejo.enSuelo = false;
            }
        }

        function dibujar() {
            // Fondo cambia de día a noche cada 20 segundos
            let cicloActual = Math.floor(tiempoCiclo / 20) % 2; // 0: día, 1: noche
            let fondoActivo = (cicloActual === 0) ? fondoDia : fondoNoche;

            if (fondoActivo.complete) {
                ctx.drawImage(fondoActivo, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = (cicloActual === 0) ? "#87CEEB" : "#0d1b2a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dibujar suelo verde
            ctx.fillStyle = "#2e8b57";
            ctx.fillRect(0, 360, canvas.width, 90);

            // Dibujar zanahorias (bolitas naranjas con hoja verde)
            for (let z of zanahorias) {
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ff8c00";
                ctx.fill();
                ctx.closePath();
                // Hoja
                ctx.fillStyle = "#228b22";
                ctx.fillRect(z.x - 3, z.y - z.radius - 6, 6, 6);
            }

            // Dibujar obstáculos
            ctx.fillStyle = "#a0522d";
            for (let o of obstaculos) {
                ctx.fillRect(o.x, o.y, o.width, o.height);
            }

            // Dibujar conejito
            if (imgConejo.complete) {
                ctx.drawImage(imgConejo, conejo.x, conejo.y, conejo.width, conejo.height);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(conejo.x, conejo.y, conejo.width, conejo.height);
            }
        }

        function loop() {
            if (!juegoActivo) return;
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        window.onload = () => iniciarJuego();
    </script>
</body>
</html>
