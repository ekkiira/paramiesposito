<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aventura del Conejito</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
            padding: 20px;
        }
        .screen-overlay img {
            width: 160px;
            max-width: 50vw;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.05);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            z-index: 5;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Marcador de progreso -->
        <div id="hud">Meta: <span id="puntuacion">0</span> / 100</div>

        <!-- Canvas del juego -->
        <canvas id="gameCanvas"></canvas>

        <!-- Pantalla de Derrota -->
        <div id="pantalla-derrota" class="screen-overlay hidden">
            <img src="pantalladeperdiste.jpg" alt="Perdiste" onerror="this.style.display='none'">
            <h2>¡Oh no, el conejito tropezó! 🥺</h2>
            <p>¡Inténtalo de nuevo, mi amor!</p>
            <button class="btn" onclick="reiniciarJuego()">Reintentar</button>
        </div>

        <!-- Pantalla de Victoria -->
        <div id="pantalla-victoria" class="screen-overlay hidden">
            <img src="Ganadorodenivel.png" alt="Ganador" onerror="this.style.display='none'">
            <h2>¡Lo lograste, pasaste el nivel! 🎉</h2>
            <p>¡Ganaste un abrazo gigante y todo mi amor!</p>
            <a href="index.html" class="btn">Volver al inicio</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Cargar imágenes
        const imgConejo = new Image();
        imgConejo.src = "conejitocorriendo.png";

        const fondoDia = new Image();
        fondoDia.src = "fondodia.jpg";

        const fondoNoche = new Image();
        fondoNoche.src = "fondonoche.jpg";

        // Ajustar resolución del Canvas dinámicamente al tamaño de pantalla
        function redimensionarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (conejo) {
                conejo.suelo = canvas.height - 110;
                if (conejo.enSuelo) {
                    conejo.y = conejo.suelo;
                }
            }
        }
        window.addEventListener('resize', redimensionarCanvas);

        // Variables del juego
        let juegoActivo = false;
        let puntaje = 0;
        let cicloFondo = 0;

        let conejo = {
            x: 80,
            y: 0,
            width: 60,
            height: 60,
            vy: 0,
            gravedad: 0.65,
            salto: -13,
            suelo: 0,
            enSuelo: true
        };

        let plataformas = [];
        let contadorFrames = 0;

        // Redimensionar al inicio
        redimensionarCanvas();

        // Controles (Teclado, Clic y Toque táctil en celulares)
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                saltar();
            }
        });

        window.addEventListener("touchstart", function(e) {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                saltar();
            }
        }, { passive: true });

        canvas.addEventListener("click", function() {
            saltar();
        });

        function saltar() {
            if (!juegoActivo) return;
            if (conejo.enSuelo) {
                conejo.vy = conejo.salto;
                conejo.enSuelo = false;
            }
        }

        function iniciarJuego() {
            redimensionarCanvas();
            puntaje = 0;
            cicloFondo = 0;
            conejo.y = conejo.suelo;
            conejo.vy = 0;
            conejo.enSuelo = true;
            plataformas = [];
            contadorFrames = 0;
            juegoActivo = true;

            document.getElementById("puntuacion").innerText = puntaje;
            document.getElementById("pantalla-derrota").classList.add("hidden");
            document.getElementById("pantalla-victoria").classList.add("hidden");
            
            loop();
        }

        function reiniciarJuego() {
            iniciarJuego();
        }

        // Genera variedad de obstáculos
        function generarPlataforma() {
            const tipos = ['zanahoria', 'hongo', 'roca', 'arbusto', 'pajaro'];
            const tipoElegido = tipos[Math.floor(Math.random() * tipos.length)];

            let ancho = 50;
            let alto = 50;
            let posY = canvas.height - 50 - alto;

            if (tipoElegido === 'zanahoria') {
                ancho = 45;
                alto = 70;
                posY = canvas.height - 50 - alto;
            } else if (tipoElegido === 'hongo') {
                ancho = 50;
                alto = 55;
                posY = canvas.height - 50 - alto;
            } else if (tipoElegido === 'roca') {
                ancho = 60;
                alto = 45;
                posY = canvas.height - 50 - alto;
            } else if (tipoElegido === 'arbusto') {
                ancho = 65;
                alto = 50;
                posY = canvas.height - 50 - alto;
            } else if (tipoElegido === 'pajaro') {
                ancho = 50;
                alto = 40;
                posY = canvas.height - 180 - Math.random() * 60; // Aéreo
            }

            plataformas.push({
                x: canvas.width,
                y: posY,
                width: ancho,
                height: alto,
                tipo: tipoElegido
            });
        }

        function actualizar() {
            if (!juegoActivo) return;

            // Gravedad del conejito
            conejo.vy += conejo.gravedad;
            conejo.y += conejo.vy;

            if (conejo.y > conejo.suelo) {
                conejo.y = conejo.suelo;
                conejo.vy = 0;
                conejo.enSuelo = true;
            }

            // Generar obstáculos cada cierto tiempo
            contadorFrames++;
            if (contadorFrames % 95 === 0) {
                generarPlataforma();
            }

            // Mover plataformas
            for (let i = plataformas.length - 1; i >= 0; i--) {
                plataformas[i].x -= 5;

                // Colisión precisa
                if (
                    conejo.x + 10 < plataformas[i].x + plataformas[i].width &&
                    conejo.x + conejo.width - 10 > plataformas[i].x &&
                    conejo.y + 10 < plataformas[i].y + plataformas[i].height &&
                    conejo.y + conejo.height > plataformas[i].y + 5
                ) {
                    juegoActivo = false;
                    document.getElementById("pantalla-derrota").classList.remove("hidden");
                }

                // Eliminar fuera de pantalla y sumar puntos
                if (plataformas[i].x + plataformas[i].width < 0) {
                    plataformas.splice(i, 1);
                    puntaje += 10;
                    document.getElementById("puntuacion").innerText = puntaje;

                    if (puntaje >= 100) {
                        juegoActivo = false;
                        document.getElementById("pantalla-victoria").classList.remove("hidden");
                    }
                }
            }

            cicloFondo = Math.floor(puntaje / 40) % 2;
        }

        // Avatar vectorial para el conejito
        function dibujarAvatarConejo(x, y, width, height) {
            ctx.save();
            ctx.translate(x, y);

            let orejaAnim = conejo.enSuelo ? Math.sin(contadorFrames * 0.2) * 4 : -5;
            let patasAnim = conejo.enSuelo ? Math.sin(contadorFrames * 0.3) * 6 : 0;

            // Sombra
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath();
            ctx.ellipse(width / 2, height - 2, 22, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Oreja trasera
            ctx.fillStyle = "#e0e0e0";
            ctx.beginPath();
            ctx.ellipse(width / 2 - 2 + orejaAnim, 10, 7, 20, -0.1, 0, Math.PI * 2);
            ctx.fill();

            // Oreja delantera
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(width / 2 + 10 + orejaAnim, 8, 7, 20, 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffb6c1";
            ctx.beginPath();
            ctx.ellipse(width / 2 + 10 + orejaAnim, 9, 3.5, 14, 0.1, 0, Math.PI * 2);
            ctx.fill();

            // Cuerpo
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.ellipse(width / 2, height / 2 + 8, 20, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabeza
            ctx.beginPath();
            ctx.arc(width / 2 + 10, height / 2 - 6, 16, 0, Math.PI * 2);
            ctx.fill();

            // Ojo
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(width / 2 + 16, height / 2 - 9, 3, 0, Math.PI * 2);
            ctx.fill();

            // Nariz
            ctx.fillStyle = "#ff9999";
            ctx.beginPath();
            ctx.arc(width / 2 + 25, height / 2 - 5, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Patas
            ctx.fillStyle = "#e6e6e6";
            ctx.beginPath();
            ctx.ellipse(width / 2 - 10 + patasAnim, height - 5, 8, 6, 0, 0, Math.PI * 2);
            ctx.ellipse(width / 2 + 12 - patasAnim, height - 5, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cola de algodón
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(width / 2 - 20, height / 2 + 10, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Dibuja las figuras/obstáculos
        function dibujarFigura(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            if (p.tipo === 'zanahoria') {
                ctx.fillStyle = "#ff7700";
                ctx.beginPath();
                ctx.moveTo(10, 18);
                ctx.lineTo(p.width - 10, 18);
                ctx.lineTo(p.width / 2, p.height);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#2ecc71";
                ctx.beginPath();
                ctx.ellipse(p.width / 2, 8, 7, 14, -0.3, 0, Math.PI * 2);
                ctx.ellipse(p.width / 2 + 6, 6, 6, 12, 0.3, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (p.tipo === 'hongo') {
                ctx.fillStyle = "#f5f5dc";
                ctx.fillRect(p.width / 2 - 9, p.height / 2, 18, p.height / 2);

                ctx.fillStyle = "#e74c3c";
                ctx.beginPath();
                ctx.arc(p.width / 2, p.height / 2, p.width / 2, Math.PI, 0, false);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(p.width / 2 - 12, p.height / 2 - 10, 4.5, 0, Math.PI * 2);
                ctx.arc(p.width / 2 + 10, p.height / 2 - 12, 3.5, 0, Math.PI * 2);
                ctx.arc(p.width / 2, p.height / 2 - 20, 4.5, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (p.tipo === 'roca') {
                ctx.fillStyle = "#7f8c8d";
                ctx.beginPath();
                ctx.moveTo(0, p.height);
                ctx.lineTo(10, 14);
                ctx.lineTo(p.width / 2, 0);
                ctx.lineTo(p.width - 8, 18);
                ctx.lineTo(p.width, p.height);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#95a5a6";
                ctx.beginPath();
                ctx.moveTo(p.width / 2, 0);
                ctx.lineTo(p.width - 8, 18);
                ctx.lineTo(p.width, p.height);
                ctx.lineTo(p.width / 2 + 5, p.height);
                ctx.closePath();
                ctx.fill();
            } 
            else if (p.tipo === 'arbusto') {
                ctx.fillStyle = "#27ae60";
                ctx.beginPath();
                ctx.arc(18, p.height - 18, 18, 0, Math.PI * 2);
                ctx.arc(p.width / 2, p.height - 25, 22, 0, Math.PI * 2);
                ctx.arc(p.width - 18, p.height - 18, 18, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (p.tipo === 'pajaro') {
                let aleteo = Math.sin(contadorFrames * 0.25) * 10;
                ctx.fillStyle = "#8e44ad";
                ctx.beginPath();
                ctx.ellipse(p.width / 2, p.height / 2, 14, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(p.width / 2, p.height / 2);
                ctx.quadraticCurveTo(p.width / 4, p.height / 2 - 18 + aleteo, 0, p.height / 2 + aleteo);
                ctx.quadraticCurveTo(p.width / 4, p.height / 2 + 5, p.width / 2, p.height / 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(p.width / 2, p.height / 2);
                ctx.quadraticCurveTo(p.width * 0.75, p.height / 2 - 18 + aleteo, p.width, p.height / 2 + aleteo);
                ctx.quadraticCurveTo(p.width * 0.75, p.height / 2 + 5, p.width / 2, p.height / 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function dibujar() {
            // Fondo de imagen o degradado
            let fondoActual = (cicloFondo === 0) ? fondoDia : fondoNoche;
            if (fondoActual.complete && fondoActual.naturalWidth !== 0) {
                ctx.drawImage(fondoActual, 0, 0, canvas.width, canvas.height);
            } else {
                let gradiente = ctx.createLinearGradient(0, 0, 0, canvas.height);
                if (cicloFondo === 0) {
                    gradiente.addColorStop(0, "#74b9ff");
                    gradiente.addColorStop(1, "#a1c4fd");
                } else {
                    gradiente.addColorStop(0, "#2c3e50");
                    gradiente.addColorStop(1, "#000000");
                }
                ctx.fillStyle = gradiente;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dibujar piso verde que cubre hasta el borde inferior
            let altoPiso = 50;
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(0, canvas.height - altoPiso, canvas.width, altoPiso);
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(0, canvas.height - altoPiso, canvas.width, 10);

            // Dibujar conejito
            if (imgConejo.complete && imgConejo.naturalWidth !== 0) {
                ctx.drawImage(imgConejo, conejo.x, conejo.y, conejo.width, conejo.height);
            } else {
                dibujarAvatarConejo(conejo.x, conejo.y, conejo.width, conejo.height);
            }

            // Dibujar obstáculos
            for (let p of plataformas) {
                dibujarFigura(p);
            }
        }

        function loop() {
            if (!juegoActivo) return;
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        window.onload = function() {
            iniciarJuego();
        };
    </script>
</body>
</html>
