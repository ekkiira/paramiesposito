<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura del Conejito - Juego</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Forzamos suavizado limpio para evitar bordes borrosos feos */
            image-rendering: auto;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            z-index: 5;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.78);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }
        .overlay img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            border: 3px solid #ffb6c1;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">Nivel: <span id="txt-nivel">1</span>/5 | Puntos: <span id="txt-puntos">0</span>/100</div>
        
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- Pantalla de Derrota -->
        <div id="pantalla-derrota" class="overlay hidden">
            <img src="pantalladeperdiste.jpg" alt="Perdiste">
            <h2>¡Oh no, el conejito tropezó! 🥺</h2>
            <p>¡Inténtalo de nuevo, mi amor!</p>
            <button class="btn" onclick="reiniciarNivel()">Reintentar Nivel</button>
        </div>

        <!-- Pantalla de Victoria de Nivel -->
        <div id="pantalla-victoria" class="overlay hidden">
            <img src="Ganadorodenivel.png" alt="Ganador">
            <h2 id="titulo-victoria">¡Nivel Superado! 🎉</h2>
            <p id="texto-victoria">¡Excelente trabajo mi amor!</p>
            <button class="btn" onclick="siguienteNivel()">Siguiente Nivel ➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // Activamos suavizado de alta calidad para que el escalado de la imagen se vea nítido
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Cargar imágenes
        const imgConejo = new Image(); imgConejo.src = "conejitocorriendo.png";
        const fondoDia = new Image(); fondoDia.src = "fondodia.jpg";
        const fondoNoche = new Image(); fondoNoche.src = "fondonoche.jpg";

        // Estado del juego
        let nivel = 1;
        let puntos = 0;
        let juegoActivo = false;
        let tiempoCiclo = 0; // Cambia día/noche cada 20 segundos

        let conejo = {
            x: 100, 
            y: 260, 
            width: 110,   // ¡Mucho más grande y visible en pantalla!
            height: 110,  // ¡Mucho más grande y visible en pantalla!
            vy: 0, 
            gravedad: 0.5, 
            fuerzaSalto: -12, 
            suelo: 260,  
            enSuelo: false
        };

        let zanahorias = []; 
        let obstaculos = []; 
        let contadorFrames = 0;

        // Controles de salto (Barra espaciadora o clic en pantalla)
        window.addEventListener("keydown", e => { 
            if (e.code === "Space") { 
                e.preventDefault(); 
                saltar(); 
            } 
        });
        canvas.addEventListener("click", () => saltar());

        function saltar() {
            if (!juegoActivo) return;
            if (conejo.enSuelo) {
                conejo.vy = conejo.fuerzaSalto;
                conejo.enSuelo = false;
            }
        }

        function iniciarJuego() {
            nivel = 1;
            cargarNivel();
        }

        function cargarNivel() {
            puntos = 0;
            tiempoCiclo = 0;
            actualizarHUD();
            conejo.y = conejo.suelo;
            conejo.vy = 0;
            conejo.enSuelo = true;
            zanahorias = [];
            obstaculos = [];
            contadorFrames = 0;

            juegoActivo = true;
            document.getElementById("pantalla-derrota").classList.add("hidden");
            document.getElementById("pantalla-victoria").classList.add("hidden");
            loop();
        }

        function reiniciarNivel() {
            cargarNivel();
        }

        function siguienteNivel() {
            nivel++;
            if (nivel > 5) {
                window.location.href = "creditos.html"; 
            } else {
                cargarNivel();
            }
        }

        function actualizarHUD() {
            document.getElementById("txt-nivel").innerText = nivel;
            document.getElementById("txt-puntos").innerText = puntos;
        }

        function actualizar() {
            if (!juegoActivo) return;

            tiempoCiclo += 1/60; 

            // Movimiento físico del conejito
            conejo.vy += conejo.gravedad;
            conejo.y += conejo.vy;

            if (conejo.y >= conejo.suelo) {
                conejo.y = conejo.suelo;
                conejo.vy = 0;
                conejo.enSuelo = true;
            } else {
                conejo.enSuelo = false;
            }

            // Velocidad del nivel (incrementa por nivel)
            let velocidadMundo = 3.5 + (nivel * 0.5);
            contadorFrames++;

            // Generar zanahorias (bolitas naranjas) en posiciones cómodas
            if (contadorFrames % 110 === 0) {
                let alturaZanahoria = Math.random() > 0.4 ? 290 : 180; 
                zanahorias.push({ x: canvas.width + 50, y: alturaZanahoria, radius: 16, valor: 20 });
            }

            // Generar obstáculos que se pueden saltar fácilmente
            if (contadorFrames % 150 === 0) {
                obstaculos.push({ x: canvas.width + 50, y: 300, width: 38, height: 60 });
            }

            // Mover y verificar zanahorias
            for (let i = zanahorias.length - 1; i >= 0; i--) {
                zanahorias[i].x -= velocidadMundo;
                
                let dx = (conejo.x + conejo.width/2) - zanahorias[i].x;
                let dy = (conejo.y + conejo.height/2) - zanahorias[i].y;
                if (Math.hypot(dx, dy) < 50) {
                    puntos += zanahorias[i].valor;
                    zanahorias.splice(i, 1);
                    actualizarHUD();

                    if (puntos >= 100) {
                        juegoActivo = false;
                        if (nivel === 5) {
                            document.getElementById("titulo-victoria").innerText = "¡Completaste todos los niveles! ❤️️";
                            document.getElementById("texto-victoria").innerText = "¡Eres la mejor jugadora, vamos a los créditos!";
                        } else {
                            document.getElementById("titulo-victoria").innerText = `¡Nivel ${nivel} Superado! 🎉`;
                            document.getElementById("texto-victoria").innerText = "¡Lo lograste, pasas al siguiente nivel!";
                        }
                        document.getElementById("pantalla-victoria").classList.remove("hidden");
                        return;
                    }
                } else if (zanahorias[i].x < -50) {
                    zanahorias.splice(i, 1);
                }
            }

            // Mover y verificar obstáculos con hitbox generosa
            for (let i = obstaculos.length - 1; i >= 0; i--) {
                obstaculos[i].x -= velocidadMundo;

                if (
                    conejo.x + 25 < obstaculos[i].x + obstaculos[i].width &&
                    conejo.x + conejo.width - 25 > obstaculos[i].x &&
                    conejo.y + conejo.height > obstaculos[i].y + 12
                ) {
                    juegoActivo = false;
                    document.getElementById("pantalla-derrota").classList.remove("hidden");
                    return;
                }

                if (obstaculos[i].x < -50) {
                    obstaculos.splice(i, 1);
                }
            }
        }

        function dibujar() {
            // Fondo día / noche cada 20 segundos
            let cicloActual = Math.floor(tiempoCiclo / 20) % 2; 
            let fondoActivo = (cicloActual === 0) ? fondoDia : fondoNoche;

            if (fondoActivo.complete) {
                ctx.drawImage(fondoActivo, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = (cicloActual === 0) ? "#87CEEB" : "#0d1b2a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dibujar zanahorias (bolitas naranjas con hojita verde)
            for (let z of zanahorias) {
                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ff7f00";
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = "#fff";
                ctx.stroke();
                ctx.closePath();

                // Hoja
                ctx.fillStyle = "#228b22";
                ctx.fillRect(z.x - 4, z.y - z.radius - 10, 8, 10);
            }

            // Dibujar obstáculos más claros y visibles
            for (let o of obstaculos) {
                ctx.fillStyle = "#8b4513";
                ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.fillStyle = "#5c2c16";
                ctx.fillRect(o.x + 5, o.y + 5, o.width - 10, 10);
            }

            // Dibujar conejito a gran escala con suavizado de alta calidad
            if (imgConejo.complete) {
                ctx.drawImage(imgConejo, conejo.x, conejo.y, conejo.width, conejo.height);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(conejo.x, conejo.y, conejo.width, conejo.height);
            }
        }

        function loop() {
            if (!juegoActivo) return;
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        window.onload = () => iniciarJuego();
    </script>
</body>
</html>
