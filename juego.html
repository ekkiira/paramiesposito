<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura del Conejito</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        canvas {
            display: block;
            background-size: cover;
            background-position: center;
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }
        .screen-overlay img {
            width: 180px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #ff69b4;
            transform: scale(1.05);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Marcador de progreso -->
        <div id="hud">Meta: <span id="puntuacion">0</span> / 100</div>

        <!-- Canvas del juego -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Pantalla de Derrota -->
        <div id="pantalla-derrota" class="screen-overlay hidden">
            <img src="pantalladeperdiste.jpg" alt="Perdiste">
            <h2>¡Oh no, el conejito tropezó! 🥺</h2>
            <p>¡Inténtalo de nuevo, mi amor!</p>
            <button class="btn" onclick="reiniciarJuego()">Reintentar</button>
        </div>

        <!-- Pantalla de Victoria -->
        <div id="pantalla-victoria" class="screen-overlay hidden">
            <img src="Ganadorodenivel.png" alt="Ganador">
            <h2>¡Lo lograste, pasaste el nivel! 🎉</h2>
            <p>¡Ganaste un abrazo gigante y todo mi amor!</p>
            <a href="index.html" class="btn">Volver al inicio</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Cargar imágenes
        const imgConejo = new Image();
        imgConejo.src = "conejitocorriendo.png";

        const fondoDia = new Image();
        fondoDia.src = "fondodia.jpg";

        const fondoNoche = new Image();
        fondoNoche.src = "fondonoche.jpg";

        // Variables del juego
        let juegoActivo = false;
        let puntaje = 0;
        let cicloFondo = 0; // Para cambiar entre día y noche

        let conejo = {
            x: 80,
            y: 280,
            width: 50,
            height: 50,
            vy: 0,
            gravedad: 0.6,
            salto: -11,
            suelo: 280,
            enSuelo: true
        };

        let plataformas = [];
        let contadorFrames = 0;

        // Controles de salto (Espacio o clic en pantalla)
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                e.preventDefault();
                saltar();
            }
        });

        canvas.addEventListener("click", function() {
            saltar();
        });

        function saltar() {
            if (!juegoActivo) return;
            if (conejo.enSuelo) {
                conejo.vy = conejo.salto;
                conejo.enSuelo = false;
            }
        }

        function iniciarJuego() {
            puntaje = 0;
            cicloFondo = 0;
            conejo.y = conejo.suelo;
            conejo.vy = 0;
            conejo.enSuelo = true;
            plataformas = [];
            contadorFrames = 0;
            juegoActivo = true;

            document.getElementById("pantalla-derrota").classList.add("hidden");
            document.getElementById("pantalla-victoria").classList.add("hidden");
            
            loop();
        }

        function reiniciarJuego() {
            iniciarJuego();
        }

        function generarPlataforma() {
            let alto = Math.random() * 50 + 60;
            plataformas.push({
                x: canvas.width,
                y: 330 - alto,
                width: 70,
                height: alto
            });
        }

        function actualizar() {
            if (!juegoActivo) return;

            // Gravedad del conejito
            conejo.vy += conejo.gravedad;
            conejo.y += conejo.vy;

            if (conejo.y > conejo.suelo) {
                conejo.y = conejo.suelo;
                conejo.vy = 0;
                conejo.enSuelo = true;
            }

            // Generar obstáculos/plataformas cada cierto tiempo
            contadorFrames++;
            if (contadorFrames % 110 === 0) {
                generarPlataforma();
            }

            // Mover plataformas
            for (let i = plataformas.length - 1; i >= 0; i--) {
                plataformas[i].x -= 4;

                // Colisión con el conejito
                if (
                    conejo.x < plataformas[i].x + plataformas[i].width &&
                    conejo.x + conejo.width > plataformas[i].x &&
                    conejo.y + conejo.height > plataformas[i].y
                ) {
                    // ¡Chocó! Perdió
                    juegoActivo = false;
                    document.getElementById("pantalla-derrota").classList.remove("hidden");
                }

                // Eliminar plataformas fuera de pantalla y sumar puntos
                if (plataformas[i].x + plataformas[i].width < 0) {
                    plataformas.splice(i, 1);
                    puntaje += 10;
                    document.getElementById("puntuacion").innerText = puntaje;

                    // Condición de Victoria (al llegar a 100 puntos)
                    if (puntaje >= 100) {
                        juegoActivo = false;
                        document.getElementById("pantalla-victoria").classList.remove("hidden");
                    }
                }
            }

            // Cambiar fondo de día y noche cada 40 puntos
            cicloFondo = Math.floor(puntaje / 40) % 2;
        }

        function dibujar() {
            // Dibujar fondo correspondiente (Día o Noche)
            let fondoActual = (cicloFondo === 0) ? fondoDia : fondoNoche;
            if (fondoActual.complete) {
                ctx.drawImage(fondoActual, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = (cicloFondo === 0) ? "#87CEEB" : "#191970";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dibujar al conejito
            if (imgConejo.complete) {
                ctx.drawImage(imgConejo, conejo.x, conejo.y, conejo.width, conejo.height);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(conejo.x, conejo.y, conejo.width, conejo.height);
            }

            // Dibujar obstáculos (zanahorias o troncos)
            ctx.fillStyle = "#ff8c00";
            for (let p of plataformas) {
                ctx.fillRect(p.x, p.y, p.width, p.height);
                // Detalle estético superior
                ctx.fillStyle = "#228b22";
                ctx.fillRect(p.x, p.y, p.width, 10);
                ctx.fillStyle = "#ff8c00";
            }
        }

        function loop() {
            if (!juegoActivo) return;
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        // Iniciar al cargar la página
        window.onload = function() {
            iniciarJuego();
        };
    </script>
</body>
</html>
